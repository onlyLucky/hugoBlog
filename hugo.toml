baseURL = "https://blog.deltastudio.space/"
theme = "mana"
defaultContentLanguage = "zh"
hasCJKLanguage = true

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[pagination]
  pageSize = 10

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", "date", "publishDate"]
  publishDate = ["publishDate", "date"]
  expiryDate = ["expiryDate"]

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  home = ["HTML", "JSON", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[params]
  enableIntegrity = false
  relatedPostsCount = 3
  math = true
  description = "记录学习、分享技术、探索计算机图形学与网站艺术特效"
  author = "Feynman"
  heroTitleLine1 = "FEYNMAN"
  heroTitleLine2 = "技术博客"
  footerText = "使用 Hugo + Mana 主题构建"

  [params.avatar]
    assetPath = "images/avatar.jpg"
    enableResize = true

  [params.avatar.about]
    assetPath = "images/avatar.jpg"
    enableResize = true

  [params.social]
    github = "https://github.com/onlyLucky"

  [params.wechatOA]
    name = "妙脆咪咪虾"
    qr = "/images/wechat-oa-qr.png"

  # GA4 / Clarity — leave empty to disable
  [params.analytics]
    google = "G-BPJK38NLDC"
    clarity = "yhio0ngc2f"

  # Search engine webmaster meta verification (empty = skip)
  # File-based verifications live in static/ (e.g. google*.html, BingSiteAuth.xml, baidu_verify_*.html)
  [params.webmaster]
    google = ""   # content of <meta name="google-site-verification" ...>
    bing = ""     # content of <meta name="msvalidate.01" ...>
    baidu = ""    # content of <meta name="baidu-site-verification" ...>
    yandex = ""   # optional: <meta name="yandex-verification" ...>

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2026
    owner = "Feynman"

# 中文（默认）
[languages.zh]
  languageCode = "zh-CN"
  languageName = "中文"
  languageDirection = "ltr"
  weight = 1
  title = "Feynman 的博客"

  [languages.zh.params]
    description = "记录学习、分享技术、探索计算机图形学与网站艺术特效"
    author = "Feynman"
    keywords = ["Feynman 博客", "计算机图形学", "Three.js 教程", "WebGL", "GLSL", "GAMES101", "前端特效"]
    heroTitleLine1 = "FEYNMAN"
    heroTitleLine2 = "技术博客"
    custom404Message = "页面不存在"
    footerText = "使用 Hugo + Mana 主题构建"

  [[languages.zh.menus.main]]
    name = "首页"
    pageRef = "/"
    weight = 10

  [[languages.zh.menus.main]]
    name = "文章"
    pageRef = "/posts"
    weight = 20

  [[languages.zh.menus.main]]
    name = "标签"
    pageRef = "/tags"
    weight = 30

  [[languages.zh.menus.main]]
    name = "合集"
    pageRef = "/series"
    weight = 35

  [[languages.zh.menus.main]]
    name = "关于"
    pageRef = "/about"
    weight = 40

# English
[languages.en]
  languageCode = "en-US"
  languageName = "English"
  languageDirection = "ltr"
  weight = 2
  title = "Feynman's Blog"

  [languages.en.params]
    description = "Recording learning, sharing technology, exploring computer graphics and web art effects"
    author = "Feynman"
    keywords = ["Feynman blog", "computer graphics", "Three.js tutorial", "WebGL", "GLSL", "GAMES101", "web effects"]
    heroTitleLine1 = "FEYNMAN"
    heroTitleLine2 = "Tech Blog"
    custom404Message = "Page not found"
    footerText = "Built with Hugo and Mana theme"

  [[languages.en.menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[languages.en.menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 20

  [[languages.en.menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 30

  [[languages.en.menus.main]]
    name = "Series"
    pageRef = "/series"
    weight = 35

  [[languages.en.menus.main]]
    name = "About"
